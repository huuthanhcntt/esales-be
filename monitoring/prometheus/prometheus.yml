global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'reservations'
    metrics_path: /metrics
    static_configs:
      - targets: ['reservations:3000']
    scrape_interval: 10s

  - job_name: 'auth'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:3001']
    scrape_interval: 10s

  - job_name: 'payments'
    metrics_path: /metrics
    static_configs:
      - targets: ['payments:3013']
    scrape_interval: 10s

  - job_name: 'notifications'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications:3014']
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'elasticsearch'
    metrics_path: /_prometheus/metrics
    static_configs:
      - targets: ['elasticsearch:9200']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
